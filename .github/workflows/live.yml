name: Live QC

on:
  schedule:
    - cron: "15 6 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "stations.geojson", ".github/workflows/live.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Fetch real NDBC data
        run: |
          mkdir -p data
          for s in 41010 44013 46042; do
            metqc fetch "$s" -o "data/$s.txt" || echo "::warning::NDBC fetch failed for $s; skipping it today"
          done
      - name: Run deterministic QC (no LLM) and build the dashboard
        run: metqc site --data data --stations stations.geojson --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
