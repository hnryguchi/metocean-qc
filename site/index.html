<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metocean-qc live</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f8fa; --fg:#1f2328; --muted:#59636e; --link:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#010409; --fg:#e6edf3; --muted:#9198a1; --link:#4493f8; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  main { max-width:580px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 4px; } p { color:var(--muted); margin:0 0 20px; }
  a { color:var(--link); } img { width:100%; height:auto; display:block; margin-bottom:8px; }
  .links { font-size:13px; margin:0 0 28px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>metocean-qc, running daily</h1>
  <p>Every day a GitHub Action downloads the latest NOAA NDBC realtime data for three buoys and runs the deterministic quality-control tests. No LLM is called in this job.</p>
  <!--STATIONS-->
  <p><a href="https://github.com/hnryguchi/metocean-qc">Source on GitHub</a></p>
</main>
</body>
</html>
